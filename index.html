<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Finance Visualizer – Track Income, Expenses &amp; Budgets</title>
    <meta name="description" content="Track income and expenses, set monthly budgets and see where your money goes. Works instantly with no signup; your data stays in your browser unless you create an account." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Personal Finance Visualizer" />
    <meta property="og:description" content="Track income and expenses, set monthly budgets and see where your money goes. No signup needed." />
    <meta property="og:url" content="https://personal-finance-visualizer-ochre-psi.vercel.app" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0b1220" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Set the theme before first paint so dark-mode users don't get a white flash.
      try {
        var p = JSON.parse(localStorage.getItem("pfv:prefs:v1") || "{}");
        var t = p.theme === "light" || p.theme === "dark" ? p.theme : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This app needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
